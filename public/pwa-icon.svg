<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36322a"/>
      <stop offset="100%" stop-color="#1c1a17"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e08c"/>
      <stop offset="50%" stop-color="#d4a72c"/>
      <stop offset="100%" stop-color="#997411"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Slate Container with Gold Rim -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Gann Square of 9 Geometric Wheel Geometry -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Cardinal Axes: 0°, 90°, 180°, 270° -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.75"/>
  <line x1="256" y1="76" x2="256" y2="436" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.75"/>

  <!-- Diagonal Harmonic Axes: 45°, 135°, 225°, 315° -->
  <line x1="128" y1="128" x2="384" y2="384" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.5"/>
  <line x1="384" y1="128" x2="128" y2="384" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.5"/>

  <!-- Square Inscription -->
  <rect x="128" y="128" width="256" height="256" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.8"/>

  <!-- Center 0° Origin Pivot Core -->
  <circle cx="256" cy="256" r="24" fill="url(#goldGrad)"/>
  <circle cx="256" cy="256" r="10" fill="#1c1a17"/>

  <!-- Cardinal Nodes -->
  <circle cx="256" cy="76" r="12" fill="#c94a46"/>  <!-- 180° Top Reversal -->
  <circle cx="256" cy="436" r="12" fill="#2e8b57"/> <!-- 0° Base Anchor -->
  <circle cx="76" cy="256" r="10" fill="url(#goldGrad)"/> <!-- 90° Intermediate -->
  <circle cx="436" cy="256" r="10" fill="url(#goldGrad)"/> <!-- 270° Demand -->
</svg>
